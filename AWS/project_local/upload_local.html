<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Upload Photo (Local Prototype)</title>
  <link rel="stylesheet" href="styles copy.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="app-title">Upload</div>
      <div class="top-actions">
        <label class="layout-switch" title="Switch between gallery and list view">
          <input type="checkbox" id="layoutToggle">
          <div class="layout-switch-inner">
            <div class="layout-thumb"></div>
          </div>
        </label>

        <label class="theme-switch">
          <input type="checkbox" id="themeToggle">
          <div class="theme-switch-inner">
            <span class="theme-text theme-text-light">LIGHT MODE</span>
            <span class="theme-text theme-text-dark">DARK MODE</span>
            <div class="theme-thumb"></div>
          </div>
        </label>

        <a href="index_local.html" class="btn">Back to gallery</a>
      </div>
    </header>

    <section class="form-card">
      <form id="uploadForm">
        <div class="form-row">
          <label for="userName">User name</label>
          <input type="text" id="userName" required>
        </div>

        <div class="form-row">
          <label for="existingTopic">Existing topic</label>
          <select id="existingTopic">
            <option value="">(none)</option>
          </select>
        </div>

        <div class="form-row">
          <label for="newTopic">New topic (optional)</label>
          <input type="text" id="newTopic" placeholder="Type to create new topic">
        </div>

        <div class="form-row">
          <label for="photoFile">Photo</label>
          <input type="file" id="photoFile" accept="image/*" required>
        </div>

        <div class="form-row">
          <button class="btn btn-primary" type="submit">Upload (local only)</button>
        </div>

        <p id="status" class="status-text"></p>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initLayoutMode();
      initPhotos();
      initUploadPage();
    });
  </script>
</body>
</html>

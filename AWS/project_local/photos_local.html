<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Photo Details (Local Prototype)</title>
  <link rel="stylesheet" href="styles copy.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="app-title">Photo</div>
      <div class="top-actions">
        <!-- layout toggle (no visual effect here, just consistent UI) -->
        <label class="layout-switch" title="Switch between gallery and list view">
          <input type="checkbox" id="layoutToggle">
          <div class="layout-switch-inner">
            <div class="layout-thumb"></div>
          </div>
        </label>

        <label class="theme-switch">
          <input type="checkbox" id="themeToggle">
          <div class="theme-switch-inner">
            <span class="theme-text theme-text-light">LIGHT MODE</span>
            <span class="theme-text theme-text-dark">DARK MODE</span>
            <div class="theme-thumb"></div>
          </div>
        </label>

        <a href="index_local.html" class="btn">Back to gallery</a>
      </div>
    </header>

    <main id="photoDetails" class="detail-layout"></main>
  </div>

  <script src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initLayoutMode();
      initPhotos();
      loadPhotoDetails();
    });
  </script>
</body>
</html>
